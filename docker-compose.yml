services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unefm-backend
    restart: unless-stopped
    # Sin `ports`: el backend NO se publica. Solo es alcanzable desde la red
    # interna de Docker (unefm-gateway y unefm-frontend). El unico acceso
    # desde internet es a traves de https://<dominio>/api/ en el gateway.
    # Nadie deberia poder Pegar http://<ip>:3001.
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - HOST=0.0.0.0
      - LD_LIBRARY_PATH=/opt/oracle/instantclient
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_IDLE_TIMEOUT=${DB_IDLE_TIMEOUT:-30000}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-5000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - ADMIN_DEFAULT_USERNAME=${ADMIN_DEFAULT_USERNAME:-admin}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin123}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@unefm.edu.ve}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-data/auth.db}
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_CONNECT=${ORACLE_CONNECT}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/data:/app/data
      - /opt/oracle/instantclient:/opt/oracle/instantclient:ro
    networks:
      - unefm-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unefm-frontend
    restart: unless-stopped
    # Solo en loopback: el Vite dev server (HMR) queda disponible para
    # trabajar en el propio servidor, pero no se expone a internet.
    # El acceso publico al sitio es via https://<dominio>/ en el gateway.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_DB_HOST_DISPLAY=${VITE_DB_HOST_DISPLAY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - unefm-network

# El servicio `nginx` que publicaba el puerto 80 fue movido al proyecto
# `~/gateway-nginx` (contenedor `unefm-gateway`), que es el unico dueno de
# los puertos 80/443 del servidor y enruta por server_name hacia este
# proyecto, nomina-unefm y unefm-social.
# Ver ~/gateway-nginx/README.md

networks:
  unefm-network:
    driver: bridge