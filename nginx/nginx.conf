worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Soporte para WebSockets (Vite HMR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preservar protocolo HTTPS si viene detrás de un proxy/terminador SSL inverso
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # DNS embebido de Docker para resolver contenedores de otras redes
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:5173;
    }

    # Nómina UNEFM (nomina-unefm compartiendo la red nomina_net)
    server {
        # Escuchar en el puerto 80 (HTTP) IPv4 e IPv6
        listen 80;
        listen [::]:80;

        server_name nomina.unefm.edu.ve;

        client_max_body_size 64M;

        # La variable + resolver redescubren la IP de nomina-unefm-proxy
        # aunque el contenedor se reinicie con otra IP
        set $nomina_backend "nomina-unefm-proxy:80";

        location / {
            proxy_pass http://$nomina_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    server {
        # Escuchar en el puerto 80 (HTTP) IPv4 e IPv6
        listen 80;
        listen [::]:80;

        # Dominio e IP del servidor
        server_name expediente.unefm.edu.ve www.expediente.unefm.edu.ve 150.187.4.193 localhost _;

        client_max_body_size 50M;

        # Frontend React
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}